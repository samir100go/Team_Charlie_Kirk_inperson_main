# CI stub (project.md Phase 1.7): lint + unit tests + docker build per service.
# Grows in Phase 10 into: compose up with the simulator → integration →
# Playwright → k6 smoke → Trivy. The commands mirror .pre-commit-config.yaml.
name: CI

on:
  push:
    branches: [main, jalani-dev]
  pull_request:
    branches: [main, jalani-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12" # what the images run (services/python.Dockerfile)
  NODE_VERSION: "24" # what the web image runs (web/Dockerfile)
  GITLEAKS_VERSION: "8.30.1" # same as the pre-commit hook

jobs:
  python:
    name: python · ruff, mypy, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: ruff check
        run: uv run --frozen ruff check --output-format=github .
      - name: ruff format
        run: uv run --frozen ruff format --check .
      - name: mypy --strict
        run: uv run --frozen mypy services scripts
      - name: pytest
        run: uv run --frozen pytest

  web:
    name: web · eslint, tsc, prettier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check

  secrets:
    name: gitleaks · full history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin gitleaks
      - run: gitleaks git --config .gitleaks.toml --redact --verbose .

  docker:
    name: docker build · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Same build args as docker-compose.yml.
        include:
          - name: core-api
            context: .
            file: services/python.Dockerfile
            args: |
              SERVICE=core_api
              PACKAGE=jalani-core-api
              PORT=8080
          - name: ingestor
            context: .
            file: services/python.Dockerfile
            args: |
              SERVICE=ingestor
              PACKAGE=jalani-ingestor
              PORT=8070
          - name: intelligence
            context: .
            file: services/python.Dockerfile
            args: |
              SERVICE=intelligence
              PACKAGE=jalani-intelligence
              PORT=8090
          - name: web
            context: web
            file: web/Dockerfile
            args: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: |
            ${{ matrix.args }}
            GIT_SHA=${{ github.sha }}
            IMAGE_TAG=ci
          tags: jalani/${{ matrix.name }}:ci
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
