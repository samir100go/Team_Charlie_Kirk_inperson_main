# Phase 0: the organizer's simulator snippet, standalone (integration guide §1).
# The full stack in docker-compose.yml (Phase 1) embeds the same service.
services:
  simulator-api:
    image: ${SIMULATOR_IMAGE:-asifmahmoud414/bup-fuel-supply-simulator:1.0.0}
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-8}
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused} # paused | running
    ports:
      - "8000:8000"
