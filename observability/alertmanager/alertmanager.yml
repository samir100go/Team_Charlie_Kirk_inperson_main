# Alerts go to core-api, which shows them in the operator UI (System Alerts).
# The webhook endpoint itself is implemented in Phase 8.
route:
  receiver: core-api
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: core-api
    webhook_configs:
      - url: http://core-api:8080/api/v1/alerts/webhook
        send_resolved: true
