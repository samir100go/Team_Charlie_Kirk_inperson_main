[project]
name = "jalani-common"
version = "0.1.0"
description = "Shared JALANI code: simulator client, schemas, resilience, telemetry, service scaffolding"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
