[project]
name = "jalani-ingestor"
version = "0.1.0"
description = "JALANI ingestor: SSE + REST ingestion of the simulator world into Postgres/Redis"
requires-python = ">=3.12"
dependencies = [
    "jalani-common",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
jalani-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ingestor"
module-root = ""
